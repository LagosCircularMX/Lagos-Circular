<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) - Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-469V8BBKLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());
        gtag("config", "G-469V8BBKLB");
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador - Lagos Circular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module">
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        window.login = async () => {
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                window.location.href = 'dashboard.html';
            } catch(error) {
                alert('Credenciales incorrectas. Contacta al administrador.');
            }
        };
    </script>
</head>
<body class="bg-[#F5F5F5] font-[Inter]">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
            <div class="text-center mb-6">
                <div class="text-4xl mb-3">🌿</div>
                <h2 class="text-2xl font-bold text-[#2E7D32]">Panel de Administración</h2>
                <p class="text-[#5D4037] text-sm mt-1">Lagos Circular - Registro de visitas</p>
            </div>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-3 border border-[#D7CCC8] rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-[#2E7D32]">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 border border-[#D7CCC8] rounded-xl mb-6 focus:outline-none focus:ring-2 focus:ring-[#2E7D32]">
            <button onclick="window.login()" class="w-full bg-[#2E7D32] text-white py-3 rounded-xl font-semibold hover:bg-[#1B5E20] transition">Acceder</button>
            <p class="text-center text-xs text-gray-400 mt-6">Acceso restringido al equipo de Lagos Circular</p>
        </div>
    </div>
</body>
</html>
