<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso a Sala de Datos | LAGOS CIRCULAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F2F2F2; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .form-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; max-width: 400px; border-top: 5px solid #F39200; }
        input { width: 100%; padding: 0.8rem; margin: 0.8rem 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn { background: #F39200; color: white; padding: 0.8rem 2rem; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn:hover { background: #e08600; }
        .mensaje { margin-top: 1rem; font-weight: 600; display: none; }
        .exito { color: #2E7D32; }
        .error { color: #C0392B; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>🔐 Acceso a Sala de Datos</h2>
        <p>Para proteger la información estratégica, necesitamos que te registres.</p>
        <form id="form-acceso">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="text" id="institucion" placeholder="Institución o empresa (opcional)">
            <button type="submit" class="btn">Acceder a la Información</button>
        </form>
        <p class="mensaje" id="mensaje-exito">✅ Registro exitoso. Redirigiendo...</p>
        <p class="mensaje" id="mensaje-error">❌ Hubo un error. Intenta de nuevo.</p>
    </div>
    <script>
        // ✅ CORREGIDO: La URL ahora coincide con el nombre real del archivo en Vercel
        var API_URL = 'https://lagos-circular-hdfb7hz7c-luis-javier-flores-flores-projects.vercel.app/api/registrar-visitas';
        
        document.getElementById('form-acceso').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var nombre = document.getElementById('nombre').value;
            var email = document.getElementById('email').value;
            var institucion = document.getElementById('institucion').value || 'No especificada';
            
            localStorage.setItem('lc_nombre', nombre);
            localStorage.setItem('lc_email', email);
            localStorage.setItem('lc_institucion', institucion);
            
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, email: email, institucion: institucion })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.success) {
                    document.getElementById('mensaje-exito').style.display = 'block';
                    document.getElementById('mensaje-error').style.display = 'none';
                    setTimeout(function() {
                        window.location.href = 'hub.html';
                    }, 1500);
                } else {
                    document.getElementById('mensaje-error').style.display = 'block';
                    document.getElementById('mensaje-exito').style.display = 'none';
                }
            })
            .catch(function() {
                document.getElementById('mensaje-error').style.display = 'block';
                document.getElementById('mensaje-exito').style.display = 'none';
                setTimeout(function() {
                    window.location.href = 'hub.html';
                }, 3000);
            });
        });
    </script>
</body>
</html>
