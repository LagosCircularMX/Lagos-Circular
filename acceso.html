<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Sala de Datos | LAGOS CIRCULAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --naranja: #F39200; --gris-fondo: #F2F2F2; --gris-texto: #4D4D4D; --gris-oscuro: #333333; --blanco: #FFFFFF; --verde: #2E7D32; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--gris-fondo); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }
        #fondo-acceso { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .form-box { background: var(--blanco); padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; border-top: 5px solid var(--naranja); position: relative; z-index: 1; }
        input { width: 100%; padding: 0.8rem; margin: 0.8rem 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn { background: var(--naranja); color: white; padding: 0.8rem 2rem; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn:hover { background: #e08600; }
        #mensaje-estado { margin-top: 1rem; font-weight: 600; }
    </style>
</head>
<body>
    <canvas id="fondo-acceso"></canvas>
    <div class="form-box">
        <h2><i class="fas fa-lock" style="color: var(--naranja);"></i></h2>
        <h2>Acceso a Sala de Datos</h2>
        <p style="color: var(--gris-texto); margin-bottom: 1.5rem;">Para proteger la información estratégica, necesitamos que te registres.</p>
        <form id="form-acceso">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="text" id="institucion" placeholder="Institución o empresa (opcional)">
            <button type="submit" class="btn">Acceder a la Información</button>
        </form>
        <p id="mensaje-estado"></p>
    </div>
    <script>
        var API_URL = 'https://lagos-circular-leads.vercel.app/api/registro';
        document.getElementById('form-acceso').addEventListener('submit', function(e) {
            e.preventDefault();
            var n = document.getElementById('nombre').value, em = document.getElementById('email').value, ins = document.getElementById('institucion').value || 'No especificada';
            localStorage.setItem('lc_nombre', n); localStorage.setItem('lc_email', em); localStorage.setItem('lc_institucion', ins);
            var me = document.getElementById('mensaje-estado'); me.style.color = '#F39200'; me.textContent = '⏳ Registrando...';
            fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: n, email: em, institucion: ins }) })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success) { me.style.color = '#2E7D32'; me.textContent = '✅ Registro exitoso. Redirigiendo...'; setTimeout(function() { window.location.href = 'hub.html'; }, 1500); }
                else { me.style.color = '#C0392B'; me.textContent = '❌ Error: ' + (d.error || 'Intenta de nuevo'); }
            })
            .catch(function() { me.style.color = '#C0392B'; me.textContent = '❌ Error de conexión. Redirigiendo...'; setTimeout(function() { window.location.href = 'hub.html'; }, 3000); });
        });
        (function() {
            var c = document.getElementById('fondo-acceso'), ctx = c.getContext('2d'), w, h, pts = [];
            for (var i = 0; i < 30; i++) pts.push({ x: Math.random()*1920, y: Math.random()*1080, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, r: Math.random()*3+1, col: Math.random()<0.6?'#F39200':'#2E7D32' });
            function resize() { w = window.innerWidth; h = window.innerHeight; c.width = w; c.height = h; }
            window.addEventListener('resize', resize); resize();
            function draw() {
                ctx.clearRect(0,0,w,h);
                for (var i = 0; i < pts.length; i++) { var p = pts[i]; p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.col; ctx.globalAlpha=0.5; ctx.fill(); }
                ctx.globalAlpha=1; requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
