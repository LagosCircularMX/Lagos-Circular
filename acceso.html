<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso a Sala de Datos | LAGOS CIRCULAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F2F2F2; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .form-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; max-width: 400px; border-top: 5px solid #F39200; }
        input { width: 100%; padding: 0.8rem; margin: 0.8rem 0; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }
        .btn { background: #F39200; color: white; padding: 0.8rem 2rem; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>🔐 Acceso a Sala de Datos</h2>
        <p>Para proteger la información estratégica, necesitamos que te registres.</p>
        <form id="form-acceso">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <button type="submit" class="btn">Acceder a la Información</button>
        </form>
    </div>
    <script>
        document.getElementById('form-acceso').addEventListener('submit', function(e) {
            e.preventDefault();
            var nombre = document.getElementById('nombre').value;
            var email = document.getElementById('email').value;
            localStorage.setItem('lc_nombre', nombre);
            localStorage.setItem('lc_email', email);
            window.location.href = 'hub.html';
        });
    </script>
</body>
</html>
