<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Google tag (gtag.js) - Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-469V8BBKLB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-469V8BBKLB');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | LAGOS CIRCULAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --naranja-institucional: #F39200;
            --gris-fondo: #F2F2F2;
            --gris-oscuro: #333333;
            --blanco: #FFFFFF;
            --verde-sostenible: #2E7D32;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gris-fondo);
            color: var(--gris-oscuro);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box, .admin-panel {
            background: var(--blanco);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-top: 5px solid var(--naranja-institucional);
        }
        .admin-panel { max-width: 1000px; display: none; }
        input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.8rem 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
        .btn {
            background: var(--naranja-institucional);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background: #e08600; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn-small {
            width: auto;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }
        th {
            background: var(--gris-oscuro);
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 0.9rem;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        tr:hover { background: #f9f9f9; }
        .contador {
            background: #E8F5E9;
            color: var(--verde-sostenible);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .error { color: #C0392B; margin-top: 0.5rem; display: none; }
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 600px) {
            table { font-size: 0.75rem; }
            th, td { padding: 8px 6px; }
        }
    </style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-screen" class="login-box">
    <h2><i class="fas fa-shield-halved" style="color: var(--naranja-institucional);"></i></h2>
    <h2>Panel de Administración</h2>
    <p style="color: #4D4D4D; margin-bottom: 1.5rem;">Acceso restringido al administrador de LAGOS CIRCULAR</p>
    <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="btn-login" onclick="verificarAcceso()"><i class="fas fa-lock-open"></i> Acceder</button>
    <p id="error-login" class="error">❌ Correo o contraseña incorrectos</p>
</div>

<!-- PANEL DE ADMINISTRACIÓN -->
<div id="admin-screen" class="admin-panel">
    <div class="header-panel">
        <h2><i class="fas fa-users" style="color: var(--naranja-institucional);"></i> Interesados Registrados</h2>
        <button class="btn btn-small" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
    </div>
    <div class="contador" id="contador">Total de registros: --</div>
    <button class="btn btn-small" onclick="cargarRegistros()" style="margin-bottom: 1rem;">
        <i class="fas fa-sync-alt"></i> Actualizar datos
    </button>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Institución</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody id="tabla-registros">
                <tr><td colspan="5" style="text-align: center;">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
    <button class="btn btn-small" onclick="exportarCSV()" style="margin-top: 1rem;">
        <i class="fas fa-download"></i> Descargar CSV
    </button>
</div>

<script>
    // La clave "anon" es pública por diseño de Supabase. Ya no es un riesgo por sí sola:
    // la política "leer_autenticado" exige haber iniciado sesión real (abajo) para poder leer la tabla.
    var SUPABASE_URL = 'https://tdxxtuhlaimmmcesclat.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkeHh0dWhsYWltbW1jZXNjbGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjM2NDksImV4cCI6MjA5NTczOTY0OX0.lgoLL29EEOeTpQAY_enkGmwS1t5S1Ans3Lnip0QRfF8';

    var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Iniciar sesión con correo y contraseña reales (verificados por Supabase Auth)
    async function verificarAcceso() {
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var btn = document.getElementById('btn-login');
        var errorMsg = document.getElementById('error-login');

        btn.disabled = true;
        btn.textContent = 'Verificando...';
        errorMsg.style.display = 'none';

        var { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-lock-open"></i> Acceder';

        if (error) {
            errorMsg.style.display = 'block';
            return;
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
        cargarRegistros();
    }

    // Cerrar sesión real de Supabase
    async function cerrarSesion() {
        await supabaseClient.auth.signOut();
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('admin-screen').style.display = 'none';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    }

    // Cargar registros usando el cliente autenticado (ya no fetch manual con la clave anon)
    async function cargarRegistros() {
        var tabla = document.getElementById('tabla-registros');
        tabla.innerHTML = '<tr><td colspan="5" style="text-align: center;">⏳ Cargando registros...</td></tr>';

        var { data, error } = await supabaseClient
            .from('interesados')
            .select('*')
            .order('fecha', { ascending: false });

        if (error) {
            tabla.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #C0392B;">Error al cargar los datos</td></tr>';
            return;
        }

        if (data.length === 0) {
            tabla.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay registros aún</td></tr>';
            document.getElementById('contador').textContent = 'Total de registros: 0';
            return;
        }

        document.getElementById('contador').textContent = 'Total de registros: ' + data.length;
        tabla.innerHTML = '';

        data.forEach(function(row, index) {
            var fecha = new Date(row.fecha).toLocaleDateString('es-MX', {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            tabla.innerHTML += '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td>' + row.nombre + '</td>' +
                '<td>' + row.email + '</td>' +
                '<td>' + (row.institucion || 'No especificada') + '</td>' +
                '<td>' + fecha + '</td>' +
            '</tr>';
        });
    }

    // Exportar a CSV usando el cliente autenticado
    async function exportarCSV() {
        var { data, error } = await supabaseClient
            .from('interesados')
            .select('*')
            .order('fecha', { ascending: false });

        if (error || !data || data.length === 0) {
            alert('No hay registros para exportar');
            return;
        }

        var csv = 'Nombre,Correo,Institución,Fecha\n';
        data.forEach(function(row) {
            csv += '"' + row.nombre + '","' + row.email + '","' + (row.institucion || '') + '","' + row.fecha + '"\n';
        });

        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'interesados_lagos_circular.csv';
        link.click();
    }

    // Al cargar la página, revisa si ya hay una sesión activa de Supabase (evita pedir login otra vez)
    (async function() {
        var { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-screen').style.display = 'block';
            cargarRegistros();
        }
    })();
</script>
</body>
</html>
